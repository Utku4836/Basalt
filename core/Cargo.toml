[package]
name = "basalt_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Profile, installation and native terminal services"

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "0.1", optional = true, default-features = false }
alacritty_terminal = { path = "../vendor/alacritty_terminal", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
parking_lot = "0.12"
fs2 = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
bytes = "1"
jsonc-parser = { version = "0.33.2", features = ["serde"] }
serde_yaml_ng = "0.10.0"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem",
  "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography",
  "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects",
  "Win32_System_Pipes", "Win32_System_IO",
] }
